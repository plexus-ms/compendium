name: verify

# Mounts the verify verb on every push (§ 2 PLX-Delivery): the requirements
# check over the map and every module, the same `mise verify` the pre-push
# hook runs, through the shared `check` mount with the whole verb as its
# task. Every push includes the update bot's branches, whose pull requests
# merge unattended only once a check is green.

on:
  push:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: plexus-ms/primitives/.github/workflows/_check.yml@0.115.0
    with:
      tasks: verify
