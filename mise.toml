[tools]
hk = "latest"               # Git hooks
shellcheck = "0.11.0"        # the check script's own static check

[hooks]
postinstall = "hk install --mise"

[tasks.check]
description = "Lint the standard: no keyword outside a requirement, no requirement in the map or below standard maturity, module frontmatter well-formed"
run = ["shellcheck essentials/requirements.sh", "./essentials/requirements.sh --check"]
