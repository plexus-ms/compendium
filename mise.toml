[tools]
hk = "latest"               # Git hooks
# plx: the requirements check (§ 1.8 PLX), the initiative's own package from
# plexus-ms/primitives, pinned at the train number by the train itself (§ 1.5
# PLX); the trust-policy approval only waives npm's new-name/low-download
# heuristics, which it trips by being young.
"npm:@plexus-ms/cli" = { version = "0.9.0", allow_low_downloads = true }

[hooks]
postinstall = "hk install --mise"

# Contract verbs (§ 3 PLX-Repo). The compendium is prose and a checker: verify
# is check, and the verbs it has no use for exist and pass.

[tasks.verify]
description = "Perform all steps that verify the standard: the check, nothing to test"
run = ["mise run check"]

[tasks.check]
description = "Lint the standard: no keyword outside a requirement, no requirement in the map or below standard maturity, module frontmatter well-formed; runs `plx requirements`"
run = "plx requirements ."

[tasks.dev]
description = "No-op: the compendium is prose; edit the files"
run = 'echo "dev: nothing to start in the compendium"'

[tasks.build]
description = "No-op: the compendium produces no artifact; the website renders it"
run = 'echo "build: nothing to build in the compendium"'
